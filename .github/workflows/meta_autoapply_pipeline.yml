name: Meta Auto-Apply Pipeline (scrape → watch → apply)

# One trigger runs the whole Meta chain in order. Fire it manually, or from the
# external cron site via the GitHub workflow-dispatch API (GH_PAT has
# Actions:write but not Contents, so use workflow_dispatch, not repository_dispatch):
#   POST /repos/OzSpidey/Job_Automation_IN/actions/workflows/meta_autoapply_pipeline.yml/dispatches
#   {"ref":"main"}
on:
  workflow_dispatch:
  repository_dispatch:
    types: [meta-autoapply-pipeline]

permissions:
  contents: write

jobs:
  # 1) Scrape Meta India → email new software roles to the auto-apply inbox
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Playwright + Chromium
        run: |
          pip install playwright python-dotenv
          python -m playwright install --with-deps chromium
      - name: Scrape + email
        env:
          EMAIL_TO_INDIA:     ${{ secrets.EMAIL_TO_INDIA }}
          EMAIL_SENDER:       ${{ secrets.EMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          META_TARGET_ROLES:  ${{ vars.META_TARGET_ROLES }}
        run: python meta_scraper_india.py
      - name: Persist seen-jobs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add json/meta_india_seen_jobs.json
          git diff --staged --quiet || git commit -m "chore: update meta india seen jobs [skip ci]"
          git checkout -- . 2>/dev/null || true
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            sleep $((i * 3))
          done

  # 2) Read the inbox → queue new roles (shared watcher, routed by subject)
  watch:
    needs: scrape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main            # see the scrape job's committed state, not the trigger SHA
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read inbox + queue (wait for email delivery first)
        env:
          AUTOAPPLY_GMAIL_USER:         oswin.autoapply@gmail.com
          AUTOAPPLY_GMAIL_APP_PASSWORD: ${{ secrets.AUTOAPPLY_GMAIL_APP_PASSWORD }}
          EMAIL_SENDER:                 ${{ secrets.EMAIL_SENDER }}
        run: |
          sleep 30
          python gmail_autoapply_watcher.py
      - name: Persist queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add json/autoapply_queue.json
          git diff --staged --quiet || git commit -m "chore: update autoapply queue [skip ci]"
          git checkout -- . 2>/dev/null || true
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            sleep $((i * 3))
          done

  # 3) Apply to Meta roles — submits at most APPLY_LIMIT/run, only if armed
  apply:
    needs: watch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main            # pick up the queue the watch job just committed
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Apply
        env:
          META_SESSION_B64:   ${{ secrets.META_SESSION_B64 }}
          META_RESUME_B64:    ${{ secrets.META_RESUME_B64 }}
          META_ANSWERS_JSON:  ${{ secrets.META_ANSWERS_JSON }}
          META_ENABLE_SUBMIT: ${{ vars.META_ENABLE_SUBMIT }}
          APPLY_LIMIT:        "1"
          EMAIL_SENDER:       ${{ secrets.EMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          APPLY_NOTIFY_EMAIL: ${{ secrets.APPLY_NOTIFY_EMAIL }}
        run: python meta_autoapply.py --apply
      - name: Upload artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: meta-pipeline-apply
          path: |
            screenshots/
            recon/
          if-no-files-found: ignore
          retention-days: 7
      - name: Persist queue/applied state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add json/autoapply_queue.json json/autoapply_applied.json
          git diff --staged --quiet || git commit -m "chore: update autoapply state [skip ci]"
          git checkout -- . 2>/dev/null || true
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            sleep $((i * 3))
          done
