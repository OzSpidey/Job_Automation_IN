name: Instahyre Auto-Apply

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "apply (default; what the cron uses) | recon (list feed) | walk (map Apply, no submit)"
        type: choice
        default: apply
        options: [apply, recon, walk]
      limit:
        description: "apply mode: max applications to submit this run (0 = all Undecided)"
        default: "0"
        type: string

permissions:
  contents: write            # apply mode commits json/instahyre_applied.json back

jobs:
  autoapply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          python -m playwright install chromium
          python -m playwright install-deps chromium
      - name: Install Xvfb
        run: sudo apt-get install -y xvfb
      - name: Run auto-apply (${{ inputs.mode }}) headful under Xvfb
        env:
          INSTAHYRE_SESSION_B64:   ${{ secrets.INSTAHYRE_SESSION_B64 }}
          INSTAHYRE_ENABLE_SUBMIT: ${{ vars.INSTAHYRE_ENABLE_SUBMIT }}
          APPLY_LIMIT:             ${{ inputs.limit }}
          EMAIL_SENDER:            ${{ secrets.EMAIL_SENDER }}
          GMAIL_APP_PASSWORD:      ${{ secrets.GMAIL_APP_PASSWORD }}
          APPLY_NOTIFY_EMAIL:      ${{ secrets.APPLY_NOTIFY_EMAIL }}
          DISPLAY: ":99"
        run: |
          Xvfb :99 -screen 0 1280x900x24 &
          sleep 2
          python instahyre_autoapply.py --${{ inputs.mode }}
      - name: Upload artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: instahyre-run
          path: |
            screenshots/
            recon/
          if-no-files-found: ignore
          retention-days: 7
      - name: Persist applied state (apply mode)
        if: ${{ inputs.mode == 'apply' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add json/instahyre_applied.json
          git diff --staged --quiet || git commit -m "chore: update instahyre applied state [skip ci]"
          git checkout -- . 2>/dev/null || true
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            sleep $((i * 3))
          done
